<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧶 두코두코 수세미 공장 🏭</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- 나눔스퀘어라운드 폰트 & Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.css">

  <style>
    body {
      font-family: 'NanumSquareRound', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fefce8; /* 따뜻한 연노랑 배경 */
      color: #334155;
      -webkit-tap-highlight-color: transparent;
      font-size: 0.88rem;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .pixel-font { font-family: 'Press Start 2P', cursive; }

    /* Pixel Factory Animation Style */
    .factory-window {
      height: 110px;
      background: linear-gradient(135deg, #e0f2fe, #fef08a);
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(253, 224, 71, 0.15);
      border: 2px solid #fef9c3;
    }
    .gear {
      position: absolute; color: #38bdf8;
      animation: gear-spin 4s linear infinite;
    }
    @keyframes gear-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .item-conveyor {
      position: absolute; bottom: 12px; left: -60px; font-size: 2rem;
      animation: conveyor-move 8s linear infinite;
    }
    @keyframes conveyor-move {
      0% { left: -60px; transform: rotate(0deg); }
      100% { left: 110%; transform: rotate(360deg); }
    }

    /* Knitting Worker Dynamic Motion */
    .knitting-worker {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: knit-work 1.2s ease-in-out infinite alternate;
    }
    @keyframes knit-work {
      0% { transform: translateY(0) rotate(-3deg) scale(0.98); }
      50% { transform: translateY(-3px) rotate(2deg) scale(1.02); }
      100% { transform: translateY(-5px) rotate(-1deg) scale(1); }
    }
    .knitting-hands {
      font-size: 0.7rem;
      position: absolute;
      bottom: 12px;
      right: -4px;
      animation: needle-wiggle 0.6s ease-in-out infinite alternate;
    }
    @keyframes needle-wiggle {
      from { transform: rotate(-15deg) scale(0.9); }
      to { transform: rotate(15deg) scale(1.1); }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'factory-yellow': '#fef08a',
            'factory-soft-yellow': '#fffbeb',
            'factory-blue': '#38bdf8',
            'factory-deep-blue': '#0284c7',
            'factory-pastel-blue': '#e0f2fe',
            'factory-dark': '#334155',
          }
        }
      }
    }
  </script>
</head>
<body class="max-w-md mx-auto p-4 pb-24">

  <!-- Header & Factory Animation -->
  <header class="text-center mb-4">
    <div class="pixel-font text-factory-blue text-[10px] mb-1.5">★ MINI KNITTING FACTORY ★</div>
    <h1 class="text-xl font-extrabold text-factory-dark flex items-center justify-center gap-2">
      <i class="fas fa-industry text-factory-blue"></i>
      두코두코 수세미 공장
    </h1>
  </header>

  <div class="factory-window">
    <i class="fas fa-cog gear text-3xl" style="top: 18px; left: 25px;"></i>
    <i class="fas fa-cog gear text-xl" style="top: 52px; left: 60px; animation-duration: 2s; animation-direction: reverse; color: #facc15;"></i>
    
    <!-- Moving Items -->
    <span class="item-conveyor" style="animation-delay: 0s;">🪨</span>
    <span class="item-conveyor" style="animation-delay: 1.3s;">☁️</span>
    <span class="item-conveyor" style="animation-delay: 2.6s;">🐤</span>
    <span class="item-conveyor" style="animation-delay: 3.9s;">🍞</span>
    <span class="item-conveyor" style="animation-delay: 5.2s;">🍳</span>
    <span class="item-conveyor" style="animation-delay: 6.5s;">🪡</span>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-yellow-100 shadow-lg z-50 max-w-md mx-auto rounded-t-2xl">
    <div class="flex justify-around p-2.5">
      <button onclick="switchTab('dash')" id="tab-dash-btn" class="flex flex-col items-center gap-1 p-2 px-6 rounded-xl bg-factory-blue text-white active:scale-95 transition-all shadow-sm">
        <i class="fas fa-chart-line text-sm"></i>
        <span class="text-xs font-bold">작업현황</span>
      </button>
      <button onclick="switchTab('form')" id="tab-form-btn" class="flex flex-col items-center gap-1 p-2 px-6 rounded-xl bg-yellow-50 text-amber-800 active:scale-95 transition-all">
        <i class="fas fa-edit text-sm"></i>
        <span class="text-xs font-bold">생산물 등록</span>
      </button>
    </div>
  </nav>

  <!-- Page 1: 작업현황 (Dashboard) -->
  <main id="page-dash" class="space-y-4">
    
    <!-- Overall Goal Card -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-yellow-100">
      <div class="flex justify-between items-center mb-2.5">
        <h3 class="text-base font-extrabold text-slate-700 flex items-center gap-1.5">
          <i class="fas fa-bullseye text-amber-400"></i>
          전체 목표 달성률
        </h3>
        <span class="pixel-font text-[10px] text-factory-deep-blue" id="progress-percent">0%</span>
      </div>
      <div class="flex justify-between items-end mb-2">
        <div class="text-xs text-slate-600">현재 <strong id="total-count" class="text-xl font-extrabold text-factory-deep-blue">0</strong> 개 완료!</div>
        <div class="text-[11px] text-slate-400">목표: <span id="target-count">100</span>개</div>
      </div>
      <div class="w-full h-3.5 bg-amber-50 rounded-full overflow-hidden border border-yellow-100 p-0.5">
        <div id="progress-fill" class="h-full bg-gradient-to-r from-yellow-300 to-factory-blue rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
      </div>
      <p class="text-[10px] text-slate-400 mt-2 text-right">* 구름 조 실적은 제봉 완료분으로 합산 반영됩니다 ☁️</p>
    </div>

    <!-- Category Summary Card -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-yellow-100">
      <h3 class="text-base font-extrabold text-slate-700 mb-3 flex items-center gap-1.5">
        <i class="fas fa-boxes-stacked text-factory-blue"></i>
        작품별 생산 현황
      </h3>
      <div id="category-summary" class="grid grid-cols-3 gap-2 text-center">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <!-- Group Workers Section -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-yellow-100 space-y-4">
      <h3 class="text-base font-extrabold text-slate-700 flex items-center gap-1.5">
        <i class="fas fa-users text-amber-400"></i>
        조별 작업자 현황
      </h3>
      <div id="group-workers" class="space-y-4">
        <!-- JS로 생성 -->
      </div>
    </div>

    <!-- Recent Messages Section -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-yellow-100 space-y-3">
      <h3 class="text-base font-extrabold text-slate-700 flex items-center gap-1.5">
        <i class="fas fa-comment-dots text-factory-blue"></i>
        최근 공장 소식 & 한줄 메시지
      </h3>
      <div id="recent-messages" class="space-y-2">
        <div class="text-[11px] text-slate-400 text-center py-3">메시지를 불러오는 중...</div>
      </div>
    </div>

  </main>

  <!-- Page 2: 생산물 등록 (Form) -->
  <main id="page-form" class="space-y-4" style="display: none;">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-yellow-100">
      <h3 class="text-base font-extrabold text-slate-700 mb-4 flex items-center gap-1.5">
        <i class="fas fa-pencil-alt text-factory-blue"></i>
        오늘의 생산량 등록하기
      </h3>
      <form id="scrub-form" class="space-y-3.5">
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-700">작업원 이름 (닉네임)</label>
          <input type="text" id="name" placeholder="예: 김뜨개" required
                 class="w-full p-3 bg-amber-50/40 border border-yellow-100 rounded-xl focus:ring-2 focus:ring-factory-blue focus:outline-none text-slate-800 text-xs">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-700">오늘 뜬 작품</label>
          <select id="item" class="w-full p-3 bg-amber-50/40 border border-yellow-100 rounded-xl focus:ring-2 focus:ring-factory-blue focus:outline-none appearance-none text-xs text-slate-800">
            <option value="🪨 조약돌">🪨 조약돌</option>
            <option value="☁️ 구름">☁️ 구름</option>
            <option value="🐤 오리">🐤 오리</option>
            <option value="🍞 식빵">🍞 식빵</option>
            <option value="🍳 계란후라이">🍳 계란후라이</option>
            <option value="🪡 (번외)제봉">🪡 (번외)제봉</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-700">완성한 개수</label>
          <input type="number" id="count" min="1" value="1" required
                 class="w-full p-3 bg-amber-50/40 border border-yellow-100 rounded-xl focus:ring-2 focus:ring-factory-blue focus:outline-none text-base font-bold text-slate-800">
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-700">한줄 응원 / 소감 메시지 (선택)</label>
          <input type="text" id="message" placeholder="예: 오늘 5개 폭풍 생산 완료! 🔥"
                 class="w-full p-3 bg-amber-50/40 border border-yellow-100 rounded-xl focus:ring-2 focus:ring-factory-blue focus:outline-none text-slate-800 text-xs">
        </div>
        <button type="submit" class="w-full p-3.5 bg-factory-blue hover:bg-factory-deep-blue text-white rounded-xl text-sm font-bold active:scale-95 transition-all shadow-md flex items-center justify-center gap-1.5 mt-2">
          <i class="fas fa-paper-plane"></i>
          <span>공장에 보고하기</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    // ⚠️⚠️⚠️ 여기에 본인의 구글 Apps Script URL을 넣으세요! ⚠️⚠️⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbw5rvdKsgZa8dfQp54Se01TH2hEjnwhwuEBLGbBH7FUzYZ9YqZ3S2hcXM2l7BYhKmBx/exec";
    const TARGET_GOAL = 100;

    const CATEGORIES = [
      { name: '🪨 조약돌', groupName: '조약돌 조' },
      { name: '☁️ 구름', groupName: '구름 조' },
      { name: '🐤 오리', groupName: '오리 조' },
      { name: '🍞 식빵', groupName: '식빵 조' },
      { name: '🍳 계란후라이', groupName: '계란후라이 조' },
      { name: '🪡 (번외)제봉', groupName: '제봉 조', note: '☁️ 구름 쫑매는 중' }
    ];

    const ANIMAL_AVATARS = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐨', '🐯', '🐥'];

    function getHashAvatar(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
      return ANIMAL_AVATARS[hash % ANIMAL_AVATARS.length];
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        const catTotals = {
          '🪨 조약돌': 0, '☁️ 구름': 0, '🐤 오리': 0,
          '🍞 식빵': 0, '🍳 계란후라이': 0, '🪡 (번외)제봉': 0
        };
        const groupUserData = {
          '🪨 조약돌': {}, '☁️ 구름': {}, '🐤 오리': {},
          '🍞 식빵': {}, '🍳 계란후라이': {}, '🪡 (번외)제봉': {}
        };
        
        data.forEach(row => {
          const cnt = Number(row.count) || 0;
          const item = row.item ? row.item.trim() : '🪨 조약돌';
          const name = row.name ? row.name.trim() : '무명 작업원';

          if (catTotals[item] !== undefined) {
            catTotals[item] += cnt;
            groupUserData[item][name] = (groupUserData[item][name] || 0) + cnt;
          }
        });

        // 총 합산 계산 시 [☁️ 구름] 개수 제외
        const effectiveTotal = catTotals['🪨 조약돌'] + 
                               catTotals['🐤 오리'] + 
                               catTotals['🍞 식빵'] + 
                               catTotals['🍳 계란후라이'] + 
                               catTotals['🪡 (번외)제봉'];

        // 1. 대시보드 진행률
        document.getElementById('total-count').innerText = effectiveTotal;
        const percent = Math.min(Math.round((effectiveTotal / TARGET_GOAL) * 100), 100);
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('progress-percent').innerText = `${percent}%`;

        // 2. 카테고리별 요약 카드
        const catSummaryEl = document.getElementById('category-summary');
        catSummaryEl.innerHTML = CATEGORIES.map(cat => `
          <div class="bg-amber-50/50 p-2 rounded-xl border border-yellow-100">
            <div class="text-[11px] text-slate-500 font-bold mb-0.5">${cat.name}</div>
            <div class="text-sm font-extrabold text-factory-deep-blue">${catTotals[cat.name] || 0}개</div>
          </div>
        `).join('');

        // 3. 조별 작업자 캐릭터 배치
        const groupWorkersEl = document.getElementById('group-workers');
        groupWorkersEl.innerHTML = CATEGORIES.map(cat => {
          const workers = groupUserData[cat.name];
          const workerEntries = Object.entries(workers);

          return `
            <div class="border-b border-yellow-100 pb-3 last:border-0">
              <div class="flex justify-between items-center mb-1.5">
                <div class="flex items-center gap-1.5">
                  <span class="font-extrabold text-slate-700 text-xs">${cat.groupName}</span>
                  ${cat.note ? `<span class="bg-sky-100 text-factory-deep-blue text-[10px] font-bold px-2 py-0.5 rounded-full border border-sky-200">${cat.note}</span>` : ''}
                </div>
                <span class="text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full font-bold">
                  총 ${catTotals[cat.name]}개
                </span>
              </div>
              <div class="flex flex-wrap gap-4 min-h-[55px] p-2.5 bg-amber-50/30 rounded-xl items-center border border-yellow-100">
                ${
                  workerEntries.length > 0 
                  ? workerEntries.map(([userName, count], idx) => `
                    <div class="knitting-worker" style="animation-delay: ${idx * 0.15}s;">
                      <!-- 머리 위 누적 개수 배지 -->
                      <span class="bg-factory-blue text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full shadow-sm mb-0.5">
                        +${count}개
                      </span>
                      <!-- 이모티콘 조합 -->
                      <div class="relative flex items-center justify-center">
                        <span class="text-2xl">${getHashAvatar(userName)}</span>
                        <span class="knitting-hands">🧶🪡</span>
                      </div>
                      <!-- 작업원 이름 -->
                      <span class="text-[10px] font-bold text-slate-600 mt-0.5">${userName}</span>
                    </div>
                  `).join('')
                  : '<span class="text-[11px] text-slate-400">아직 참여한 작업원이 없습니다 🐣</span>'
                }
              </div>
            </div>
          `;
        }).join('');

        // 4. 최근 한줄 메시지 목록 (등록 날짜 표시 추가)
        const recentMessagesEl = document.getElementById('recent-messages');
        const recentData = [...data].reverse().slice(0, 5);
        
        recentMessagesEl.innerHTML = recentData.map(row => `
          <div class="p-2.5 bg-amber-50/40 rounded-xl border border-yellow-100 text-xs space-y-0.5">
            <div class="flex justify-between items-center font-bold text-slate-700">
              <span>${row.name || '무명 작업원'} <span class="font-normal text-slate-400">(${row.item || '작품'} +${row.count || 1}개)</span></span>
              ${row.date ? `<span class="text-[10px] font-normal text-slate-400 bg-white/60 px-1.5 py-0.5 rounded-md border border-yellow-100">${row.date}</span>` : ''}
            </div>
            <div class="text-slate-600 font-medium pt-0.5">
              "${row.message && row.message.trim() !== '' ? row.message : '오늘도 열심히 열뜨했어요! 🧶'}"
            </div>
          </div>
        `).join('') || '<div class="text-[11px] text-slate-400 text-center py-2">등록된 메시지가 없습니다.</div>';

      } catch (err) {
        console.error(err);
      }
    }

    function switchTab(tab) {
      const dashPage = document.getElementById('page-dash');
      const formPage = document.getElementById('page-form');
      const dashBtn = document.getElementById('tab-dash-btn');
      const formBtn = document.getElementById('tab-form-btn');

      if (tab === 'dash') {
        dashPage.style.display = 'block';
        formPage.style.display = 'none';
        dashBtn.className = dashBtn.className.replace('bg-yellow-50 text-amber-800', 'bg-factory-blue text-white shadow-sm');
        formBtn.className = formBtn.className.replace('bg-factory-blue text-white shadow-sm', 'bg-yellow-50 text-amber-800');
        loadData();
      } else {
        dashPage.style.display = 'none';
        formPage.style.display = 'block';
        formBtn.className = formBtn.className.replace('bg-slate-100 text-slate-500', 'bg-factory-blue text-white shadow-sm');
        dashBtn.className = dashBtn.className.replace('bg-factory-blue text-white shadow-sm', 'bg-yellow-50 text-amber-800');
      }
    }

    document.getElementById('scrub-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button');
      submitBtn.innerText = "공장에 보고 중...";
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      const payload = {
        name: document.getElementById('name').value,
        item: document.getElementById('item').value,
        count: document.getElementById('count').value,
        message: document.getElementById('message').value || '오늘도 열심히 열뜨했어요! 🧶'
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        
        alert('🎉 두코두코 공장에 수세미 실적이 성공적으로 보고되었습니다!');
        document.getElementById('scrub-form').reset();
        switchTab('dash');
      } catch (err) {
        alert('오류가 발생했습니다. 다시 시도해주세요.');
      } finally {
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>공장에 보고하기</span>';
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    });

    // 초기에 데이터 로드
    loadData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧶 두코두코 수세미 공장 🏭</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'factory-bg': '#fcfaf7',
            'factory-pink': '#ff7675',
            'factory-cyan': '#81ecec',
            'factory-dark': '#2d3436',
          },
          fontFamily: {
            pixel: ['"Press Start 2P"', 'cursive'],
            sans: ['"Noto Sans KR"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #fcfaf7; -webkit-tap-highlight-color: transparent; }
    .pixel-font { font-family: 'Press Start 2P', cursive; }
    
    /* Pixel Factory Animation Style */
    .factory-window {
      height: 120px;
      background: linear-gradient(#ffeaa7, #fab1a0);
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
    }
    .gear {
      position: absolute; color: #ff7675;
      animation: gear-spin 4s linear infinite;
    }
    @keyframes gear-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .item-conveyor {
      position: absolute; bottom: 15px; left: -60px; font-size: 2rem;
      animation: conveyor-move 8s linear infinite;
    }
    @keyframes conveyor-move {
      0% { left: -60px; transform: rotate(0deg); }
      100% { left: 110%; transform: rotate(360deg); }
    }

    /* Knitting Worker Animation */
    .knitting-worker {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: knit-bounce 1.5s ease-in-out infinite alternate;
    }
    @keyframes knit-bounce {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-6px) rotate(3deg); }
    }
  </style>
</head>
<body class="max-w-md mx-auto p-4 pb-24">

  <!-- Header & Factory Animation -->
  <header class="text-center mb-6">
    <div class="pixel-font text-factory-pink text-xs mb-2">MINI KNITTING FACTORY</div>
    <h1 class="text-2xl font-bold text-factory-dark flex items-center justify-center gap-2">
      <i class="fas fa-industry text-factory-cyan"></i>
      두코두코 수세미 공장
    </h1>
  </header>

  <div class="factory-window">
    <i class="fas fa-cog gear text-4xl" style="top: 20px; left: 30px;"></i>
    <i class="fas fa-cog gear text-2xl" style="top: 60px; left: 70px; animation-duration: 2s; animation-direction: reverse;"></i>
    
    <!-- Moving Items (6 categories) -->
    <span class="item-conveyor" style="animation-delay: 0s;">🪨</span>
    <span class="item-conveyor" style="animation-delay: 1.3s;">☁️</span>
    <span class="item-conveyor" style="animation-delay: 2.6s;">🐤</span>
    <span class="item-conveyor" style="animation-delay: 3.9s;">🍞</span>
    <span class="item-conveyor" style="animation-delay: 5.2s;">🍳</span>
    <span class="item-conveyor" style="animation-delay: 6.5s;">🪡</span>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 shadow-lg z-50 max-w-md mx-auto rounded-t-3xl">
    <div class="flex justify-around p-3">
      <button onclick="switchTab('dash')" id="tab-dash-btn" class="flex flex-col items-center gap-1.5 p-2 px-6 rounded-xl bg-factory-cyan text-white active:scale-95 transition-all">
        <i class="fas fa-chart-line text-lg"></i>
        <span class="text-xs font-bold">작업현황</span>
      </button>
      <button onclick="switchTab('form')" id="tab-form-btn" class="flex flex-col items-center gap-1.5 p-2 px-6 rounded-xl bg-gray-100 text-gray-500 active:scale-95 transition-all">
        <i class="fas fa-edit text-lg"></i>
        <span class="text-xs font-bold">생산물 등록</span>
      </button>
    </div>
  </nav>

  <!-- Page 1: 작업현황 (Dashboard) -->
  <main id="page-dash" class="space-y-6">
    
    <!-- Overall Goal Card -->
    <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-50">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fas fa-bullseye text-factory-pink"></i>
          전체 목표 달성률
        </h3>
        <span class="pixel-font text-xs text-factory-cyan" id="progress-percent">0%</span>
      </div>
      <div class="flex justify-between items-end mb-2.5">
        <div class="text-sm text-gray-500">현재 <strong id="total-count" class="text-3xl font-extrabold text-factory-dark">0</strong> 개 생산 완료!</div>
        <div class="text-xs text-gray-400">목표: <span id="target-count">100</span>개</div>
      </div>
      <div class="w-full h-4 bg-gray-100 rounded-full overflow-hidden">
        <div id="progress-fill" class="h-full bg-gradient-to-r from-factory-cyan to-factory-pink rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
      </div>
    </div>

    <!-- Category Summary Card -->
    <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-50">
      <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i class="fas fa-boxes-stacked text-factory-cyan"></i>
        작품별 생산 현황
      </h3>
      <div id="category-summary" class="grid grid-cols-3 gap-3 text-center">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <!-- Group Workers Section -->
    <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-50 space-y-6">
      <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
        <i class="fas fa-users text-amber-400"></i>
        조별 작업자 현황
      </h3>
      <div id="group-workers" class="space-y-6">
        <!-- JS로 각 조별 이모티콘 및 라인 생성 -->
      </div>
    </div>

  </main>

  <!-- Page 2: 생산물 등록 (Form) -->
  <main id="page-form" class="space-y-6" style="display: none;">
    <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-50">
      <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
        <i class="fas fa-pencil-alt text-factory-cyan"></i>
        오늘의 생산량 등록하기
      </h3>
      <form id="scrub-form" class="space-y-5">
        <div class="space-y-2">
          <label class="text-sm font-bold text-gray-700">작업원 이름 (닉네임)</label>
          <input type="text" id="name" placeholder="예: 김뜨개" required
                 class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-factory-cyan focus:outline-none">
        </div>
        <div class="space-y-2">
          <label class="text-sm font-bold text-gray-700">오늘 뜬 작품</label>
          <select id="item" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-factory-cyan focus:outline-none appearance-none text-base">
            <option value="🪨 조약돌">🪨 조약돌</option>
            <option value="☁️ 구름">☁️ 구름</option>
            <option value="🐤 오리">🐤 오리</option>
            <option value="🍞 식빵">🍞 식빵</option>
            <option value="🍳 계란후라이">🍳 계란후라이</option>
            <option value="🪡 (번외)제봉">🪡 (번외)제봉</option>
          </select>
        </div>
        <div class="space-y-2">
          <label class="text-sm font-bold text-gray-700">완성한 개수</label>
          <input type="number" id="count" min="1" value="1" required
                 class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-factory-cyan focus:outline-none text-lg font-bold">
        </div>
        <button type="submit" class="w-full p-4 bg-factory-pink text-white rounded-2xl text-base font-bold active:scale-95 transition-all shadow-md">
          <i class="fas fa-paper-plane mr-1"></i>
          공장에 제출하기
        </button>
      </form>
    </div>
  </main>

  <script>
    // ⚠️⚠️⚠️ 여기에 본인의 구글 Apps Script URL을 넣으세요! ⚠️⚠️⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbw5rvdKsgZa8dfQp54Se01TH2hEjnwhwuEBLGbBH7FUzYZ9YqZ3S2hcXM2l7BYhKmBx/exec";
    const TARGET_GOAL = 100; // 전체 목표 수량 100개 설정

    const CATEGORIES = [
      { name: '🪨 조약돌', groupName: '조약돌 조' },
      { name: '☁️ 구름', groupName: '구름 조' },
      { name: '🐤 오리', groupName: '오리 조' },
      { name: '🍞 식빵', groupName: '식빵 조' },
      { name: '🍳 계란후라이', groupName: '계란후라이 조' },
      { name: '🪡 (번외)제봉', groupName: '제봉 조' }
    ];

    // 작업원 이모티콘 랜덤 풀 (뜨개질하는 캐릭터 연출)
    const AVATARS = ['🧶🐱', '🧶🐶', '🧶🐰', '🧶🐻', '🧶🦊', '🧶🐼', '🧶🐨', '🧶🐯', '🧶🐥'];

    function getHashAvatar(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash += name.charCodeAt(i);
      return AVATARS[hash % AVATARS.length];
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        let total = 0;
        const catTotals = {
          '🪨 조약돌': 0, '☁️ 구름': 0, '🐤 오리': 0,
          '🍞 식빵': 0, '🍳 계란후라이': 0, '🪡 (번외)제봉': 0
        };
        const groupUserData = {
          '🪨 조약돌': {}, '☁️ 구름': {}, '🐤 오리': {},
          '🍞 식빵': {}, '🍳 계란후라이': {}, '🪡 (번외)제봉': {}
        };
        
        data.forEach(row => {
          const cnt = Number(row.count) || 0;
          const item = row.item ? row.item.trim() : '🪨 조약돌';
          const name = row.name ? row.name.trim() : '무명 작업원';

          total += cnt;

          if (catTotals[item] !== undefined) {
            catTotals[item] += cnt;
            groupUserData[item][name] = (groupUserData[item][name] || 0) + cnt;
          }
        });

        // 1. 대시보드 진행률
        document.getElementById('total-count').innerText = total;
        const percent = Math.min(Math.round((total / TARGET_GOAL) * 100), 100);
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('progress-percent').innerText = `${percent}%`;

        // 2. 카테고리별 요약 카드
        const catSummaryEl = document.getElementById('category-summary');
        catSummaryEl.innerHTML = CATEGORIES.map(cat => `
          <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
            <div class="text-xs text-gray-500 font-bold mb-1">${cat.name}</div>
            <div class="text-lg font-extrabold text-factory-dark">${catTotals[cat.name] || 0}개</div>
          </div>
        `).join('');

        // 3. 조별 작업자 캐릭터 배치
        const groupWorkersEl = document.getElementById('group-workers');
        groupWorkersEl.innerHTML = CATEGORIES.map(cat => {
          const workers = groupUserData[cat.name];
          const workerEntries = Object.entries(workers);

          return `
            <div class="border-b border-gray-100 pb-4 last:border-0">
              <div class="flex justify-between items-center mb-3">
                <span class="font-bold text-gray-700">${cat.name} ${cat.groupName}</span>
                <span class="text-xs px-2.5 py-1 bg-gray-100 text-gray-600 rounded-full font-bold">
                  총 ${catTotals[cat.name]}개
                </span>
              </div>
              <div class="flex flex-wrap gap-4 min-h-[60px] p-3 bg-gray-50 rounded-2xl items-center">
                ${
                  workerEntries.length > 0 
                  ? workerEntries.map(([userName, count], idx) => `
                    <div class="knitting-worker" style="animation-delay: ${idx * 0.2}s;">
                      <!-- 머리 위 누적 개수 배지 -->
                      <span class="bg-factory-pink text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm mb-1">
                        +${count}개
                      </span>
                      <!-- 랜덤 뜨개질 이모티콘 -->
                      <span class="text-2xl">${getHashAvatar(userName)}</span>
                      <!-- 작업원 이름 -->
                      <span class="text-xs font-bold text-gray-600 mt-1">${userName}</span>
                    </div>
                  `).join('')
                  : '<span class="text-xs text-gray-400">아직 참여한 작업원이 없습니다.</span>'
                }
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
      }
    }

    function switchTab(tab) {
      const dashPage = document.getElementById('page-dash');
      const formPage = document.getElementById('page-form');
      const dashBtn = document.getElementById('tab-dash-btn');
      const formBtn = document.getElementById('tab-form-btn');

      if (tab === 'dash') {
        dashPage.style.display = 'block';
        formPage.style.display = 'none';
        dashBtn.className = dashBtn.className.replace('bg-gray-100 text-gray-500', 'bg-factory-cyan text-white');
        formBtn.className = formBtn.className.replace('bg-factory-cyan text-white', 'bg-gray-100 text-gray-500');
        loadData();
      } else {
        dashPage.style.display = 'none';
        formPage.style.display = 'block';
        formBtn.className = formBtn.className.replace('bg-gray-100 text-white', 'bg-factory-cyan text-white');
        dashBtn.className = dashBtn.className.replace('bg-factory-cyan text-white', 'bg-gray-100 text-gray-500');
      }
    }

    document.getElementById('scrub-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button');
      submitBtn.innerText = "공장에 제출 중...";
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      const payload = {
        name: document.getElementById('name').value,
        item: document.getElementById('item').value,
        count: document.getElementById('count').value,
        message: '응원합니다!'
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        
        alert('🎉 두코두코 공장에 수세미가 성공적으로 제출되었습니다!');
        document.getElementById('scrub-form').reset();
        switchTab('dash');
      } catch (err) {
        alert('오류가 발생했습니다. 다시 시도해주세요.');
      } finally {
        submitBtn.innerText = "🚀 공장에 제출하기";
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    });

    // 초기에 데이터 로드
    loadData();
  </script>
</body>
</html>
